<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcPay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="savedListsPanel" class="saved-lists-panel" hidden>
    <div class="saved-lists-header">
      <strong>CSV List</strong>
      <button id="closeSavedLists" aria-label="Close saved lists">×</button>
    </div>

    <div class="saved-list-save">
      <label for="savedCsvFile" id="savedCsvUpload" class="saved-csv-upload">
        ＋ Add CSV
      </label>
      <input id="savedCsvFile" type="file" accept=".csv,text/csv" hidden>
    </div>

    <p id="savedListsEmptyState">Connect wallet to view saved CSV list</p>

    <div id="savedListsContent">
    </div>
  </aside>
  <div id="savedCsvNameOverlay" class="saved-list-action-overlay" hidden>
    <div class="saved-list-action-dialog">
      <strong>Name your CSV</strong>

      <input
        id="savedCsvNameInput"
        type="text"
        maxlength="50"
        placeholder="e.g. Family"
        autocomplete="off"
      >

      <div class="saved-list-dialog-actions">
        <button id="confirmSavedCsvName">Save</button>
      </div>
    </div>
  </div>

  <div id="savedListRenameOverlay" class="saved-list-action-overlay" hidden>
    <div class="saved-list-action-dialog">
      <strong id="savedListRenameTitle">Rename: </strong>

      <input
        id="savedListRenameInput"
        type="text"
        maxlength="50"
        autocomplete="off"
      >

      <div class="saved-list-dialog-actions">

        <button id="confirmSavedListRename">
          Save
        </button>
      </div>
    </div>
  </div>

  <div id="savedListDeleteOverlay" class="saved-list-action-overlay" hidden>
    <div class="saved-list-action-dialog">
      <strong id="savedListDeleteTitle">Delete: </strong>
      <p id="savedListDeleteText"></p>

      <div class="saved-list-dialog-actions">

        <button id="confirmSavedListDelete">
          Delete
        </button>
      </div>
    </div>
  </div>

  <main class="container">
    <section class="card">

      <header class="homepage-header">
        <button id="savedListsButton" class="saved-lists-button" aria-label="Open saved lists">
          ☰
        </button>
        <div class="homepage-header-text">
          <h1>ArcPay</h1>
          <p class="subtitle">Simple USDC payments on Arc Testnet.</p>
        </div>
      </header>

      <p id="walletStatus" hidden></p>
      <div id="walletSection">
        <div id="walletProfile">
          <div id="walletAvatar"></div>
          <div class="wallet-profile-info">
            <strong id="walletShortAddress">***************</strong>
            <span id="walletNetwork">..............</span>
          <span id="walletBalance">0 USDC</span>
          </div>
        </div>
        <button id="connectButton">Connect Wallet</button>
        <button id="disconnectButton" hidden>Disconnect Wallet</button>
      </div>

      <hr>

      <p class="eyebrow">SINGLE PAYMENT</p>

      <label for="recipient">Recipient address</label>
      <input
        id="recipient"
        type="text"
        placeholder="0x..."
        autocomplete="off"
      >

      <label for="amount">Amount (USDC)</label>
      <input
        id="amount"
        type="number"
        min="0"
        step="0.000001"
        placeholder="0.00"
      >

      <button id="sendButton" disabled>Send</button>

      <p id="message"></p>

      <hr>

      <p class="eyebrow">BATCH PAYMENT</p>
      <h2>Send to multiple wallets</h2>
      <p class="subtitle">Upload a CSV with up to 1000 recipients.</p>
      <input id="csvFile" type="file" accept=".csv,text/csv" hidden>


      <p id="csvSummary"></p>
      <textarea id="batchPayments" hidden></textarea>
      <div id="csvPreview" hidden>
        <div class="csv-preview-header">
          <strong>Batch Preview</strong>
          <span id="csvRecipientCount"></span>
        </div>
        <div id="csvPreviewList"></div>
        <div class="csv-preview-total">
          <span>Total</span>
          <strong id="csvTotalAmount">0 USDC</strong>
        </div>
      </div>

      <button id="batchSendButton" disabled>
        Send Batch
      </button>

      <p id="batchMessage"></p>

    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
