<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcPay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">

      <p class="eyebrow">ARC TESTNET</p>
      <h1>ArcPay</h1>
      <p class="subtitle">Simple USDC payments on Arc Testnet.</p>

      <button id="connectButton">Connect Wallet</button>
      <p id="walletStatus">Wallet not connected</p>

      <hr>

      <p class="eyebrow">SINGLE PAYMENT</p>

      <label for="recipient">Recipient address</label>
      <input
        id="recipient"
        type="text"
        placeholder="0x..."
        autocomplete="off"
      >

      <label for="amount">Amount (USDC)</label>
      <input
        id="amount"
        type="number"
        min="0"
        step="0.000001"
        placeholder="0.00"
      >

      <button id="sendButton" disabled>Send Payment</button>

      <p id="message"></p>

      <hr>

      <p class="eyebrow">BATCH PAYMENT</p>
      <h2>Send to multiple wallets</h2>
      <p class="subtitle">Upload a CSV with up to 100 recipients.</p>

      <label for="csvFile">CSV file</label>
      <input
        id="csvFile"
        type="file"
        accept=".csv,text/csv"
      >

      <p id="csvSummary"></p>

      <label for="batchPayments">Recipients and amounts</label>
      <textarea
        id="batchPayments"
        rows="6"
        placeholder="0xRecipientAddress,0.5&#10;0xRecipientAddress,1.25"
      ></textarea>

      <p class="batch-help">
        One recipient per line: wallet address, amount in USDC.
      </p>

      <button id="batchSendButton" disabled>
        Send Batch Payment
      </button>

      <p id="batchMessage"></p>

    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
